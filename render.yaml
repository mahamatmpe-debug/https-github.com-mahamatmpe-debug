services:
  - type: web
    name: cnffd-2026
    runtime: node
    plan: free
    region: frankfurt
    rootDir: .
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: SITE_NAME
        value: "CNFFD 2026"
      - key: PHONE_CHAD
        value: "+235 62 72 93 93"
      - key: FACEBOOK_URL
        value: "https://www.facebook.com/share/1E682wpX91/"
      - key: FACEBOOK_PAGE
        value: "CNFFD2026"
      - key: ORDER_EMAIL
        value: "mahamatmpe@gmail.com"
      - key: MAIL_FROM
        value: "CNFFD 2026 <no-reply@cnffd.com>"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_SECURE
        value: "false"
