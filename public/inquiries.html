<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#00bb55">
  <meta name="description" content="CNFFD Academy Drone Tchad - consultez et commandez vos composants en ligne">
  <title>Demander info | CNFFD Academy Drone Tchad</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="/img/icon-192.png">
  <link rel="apple-touch-icon" href="/img/icon-192.png">
  <link rel="manifest" href="/manifest.webmanifest">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a class="logo" href="/"><img src="/img/logo.jpeg" alt="logo"><span>CNFFD Academy Drone Tchad</span></a>
      <nav class="nav">
        <a href="/">Accueil</a>
        <a href="/social">Réseaux sociaux</a>
        <a href="/about">À propos</a>
        <a href="/inquiries">Demander info</a>
      </nav>
      <div class="actions">
        <button id="install-btn" class="btn primary" hidden>Installer l'application</button>
        <a class="btn" href="/orders">Panier (<span id="cart-count">0</span>)</a>
      </div>
    </div>
  </header>
  <main class="main container"><h1>Demander des informations</h1>
<form id="inq-form">
  <div class="grid2">
    <label>Nom complet <input name="name" required></label>
    <label>Téléphone <input name="phone" required></label>
    <label>Email (optionnel) <input name="email" type="email"></label>
    <label>Sujet <input name="subject" required></label>
  </div>
  <label>Message <textarea name="message" rows="6" required></textarea></label>
  <button class="btn primary" type="submit">Envoyer</button>
  <p id="inq-msg"></p>
</form>

<form name="question" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="text" name="bot-field">
  <input type="text" name="nom">
  <input type="text" name="telephone">
  <input type="text" name="email">
  <input type="text" name="sujet">
  <textarea name="message"></textarea>
</form></main>
  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 CNFFD Academy Drone Tchad. Tous droits réservés.</p>
      <p>Contact Tchad : +235 62 72 93 93 | <a href="https://www.facebook.com/share/1E682wpX91/" target="_blank" rel="noopener">Facebook</a></p>
    </div>
  </footer>
  <script src="/js/store.js"></script>
  <script src="/js/pwa.js"></script>
  
</body>
</html>
