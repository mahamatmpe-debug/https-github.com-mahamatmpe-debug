[build]
  command = "node build.js"
  publish = "public"

[[redirects]]
  from = "/orders"
  to = "/orders.html"
  status = 200

[[redirects]]
  from = "/inquiries"
  to = "/inquiries.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/social"
  to = "/social.html"
  status = 200

[[redirects]]
  from = "/offline"
  to = "/offline.html"
  status = 200

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
